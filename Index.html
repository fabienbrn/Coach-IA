<style>
:root{
  --bg:#0E1A20; --surface:#152730; --surface2:#1B333E; --line:#254550;
  --ink:#EAF2F4; --ink-soft:#8FAAB4; --ink-dim:#5F7F8B;
  --accent:#FF6B35; --accent-soft:#3A2119; --gold:#F2C94C; --ok:#43C59E; --warn:#E8574B;
  --r:14px; --r-lg:22px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior-y:contain}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));line-height:1.45;font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.02em}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0 0 10px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.03em;font-weight:800}

/* ---------- structure ---------- */
.app{max-width:560px;margin:0 auto;padding:0 var(--pad)}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 72%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .who span{font-size:12.5px;color:var(--ink-soft)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--accent);flex:none}
.view{animation:in .22s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:transparent;border-color:var(--line)}
.card.hero{background:linear-gradient(150deg,var(--surface2),var(--surface));border-radius:var(--r-lg);padding:20px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--ink-soft)}
.dim{color:var(--ink-dim)}
.small{font-size:13px}
.xs{font-size:11.5px}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.sep{height:1px;background:var(--line);margin:14px 0}
.eyebrow{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:#1A0B04;
  font-weight:700;font-size:16px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.gold{background:var(--gold);color:#231A00}
.btn.danger{background:transparent;border-color:#5A2A26;color:var(--warn)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:10px}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:10px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink-soft);font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

/* ---------- formulaires ---------- */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:11px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink);outline:none}
input:focus,select,textarea:focus{border-color:var(--accent)}
input[type=number]{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{flex:1;padding:12px 6px;background:transparent;border:0;color:var(--ink-soft);font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#1A0B04}

/* ---------- navigation ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,26,32,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-dim);font-size:10.5px;cursor:pointer;padding:4px 0;font-weight:600}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* ---------- séance ---------- */
.exo{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:var(--surface)}
.exo .head{padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.exo .head b{display:block;font-size:15.5px}
.exo .body{padding:0 16px 14px}
.exo.done{opacity:.62}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .idx{font-size:13px;color:var(--ink-dim);font-weight:700;text-align:center}
.setrow input{padding:11px 8px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.setrow .tick{width:46px;height:44px;border-radius:11px;border:1px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-dim)}
.setrow .tick.on{background:var(--ok);border-color:var(--ok);color:#06231A}
.setrow.done input{border-color:#2C5A4C;color:var(--ok)}
.hint{font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:flex-start;margin-top:2px}

/* ---------- timer ---------- */
.timerbar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:45;
  max-width:560px;margin:0 auto;padding:0 var(--pad)}
.timerbar .in{background:var(--accent);color:#1A0B04;border-radius:14px;padding:12px 16px;
  display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.timerbar .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.timerbar button{background:rgba(0,0,0,.16);border:0;color:inherit;padding:8px 12px;border-radius:9px;font-weight:700;cursor:pointer}
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- divers ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink-soft)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.gold{background:#3A2F0C;color:var(--gold)}
.badge.ok{background:#123329;color:var(--ok)}
.lvl{height:7px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.stat .v{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.15}
.stat .k{font-size:12px;color:var(--ink-soft);margin-top:2px}
.fig{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
.fig svg{width:100%;height:auto;display:block}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(6,12,15,.72);display:flex;align-items:flex-end}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;
  padding:18px var(--pad) calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  border-top:1px solid var(--line);animation:up .2s ease both}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));z-index:70;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:in .2s ease both;max-width:88%;text-align:center}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h td{padding:7px 0;border-bottom:1px solid var(--line)}
table.h td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;background:var(--surface)}
.q.good{border-color:var(--ok);background:#0F2C24}
.q.bad{border-color:var(--warn);background:#2C1512}
.empty{text-align:center;padding:34px 18px;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
</style>
</head>

<script>
/* =====================================================================
   CHARGE, coach de musculation. Données.
   Références méthodo : Schoenfeld & coll. (volume et hypertrophie),
   Helms & coll. (RIR, autorégulation), Mifflin-St Jeor (dépense),
   Morton & coll. 2018 (1,6 g/kg de protéines), ACSM.

/* ---------------- Illustrations vectorielles (départ / fin) ---------- */
const P = {

  deboutBarre: {h:[50,16], s:[50,28], p:[50,54], k:[50,76], a:[50,96], e:[44,38], w:[42,28]},

  pompeHaut:   {h:[22,52], s:[32,56], p:[58,68], k:[74,80], a:[86,90], e:[32,72], w:[32,88]},
  pompeBas:    {h:[20,66], s:[30,68], p:[58,76], k:[74,84], a:[86,90], e:[22,78], w:[30,88]},
  dipHaut:     {h:[48,20], s:[48,32], p:[50,56], k:[62,74], a:[70,88], e:[42,44], w:[40,56]},
  dipBas:      {h:[48,38], s:[48,50], p:[50,72], k:[62,86], a:[70,96], e:[36,50], w:[40,58]},
  ohpBas:      {h:[50,16], s:[50,30], p:[50,56], k:[50,76], a:[50,96], e:[40,38], w:[44,26]},
  ohpHaut:     {h:[50,18], s:[50,30], p:[50,56], k:[50,76], a:[50,96], e:[46,20], w:[48,8]},
  latBas:      {h:[50,16], s:[50,28], p:[50,54], k:[50,76], a:[50,96], e:[54,42], w:[56,56]},
  latHaut:     {h:[50,16], s:[50,28], p:[50,54], k:[50,76], a:[50,96], e:[70,28], w:[86,26]},
  tracHaut:    {h:[50,26], s:[50,38], p:[52,62], k:[54,82], a:[52,98], e:[48,24], w:[48,10]},
  tracBas:     {h:[50,42], s:[50,54], p:[52,76], k:[58,92], a:[54,104],e:[46,32], w:[48,10]},
  rowHaut:     {h:[26,38], s:[34,42], p:[58,54], k:[56,74], a:[54,96], e:[34,58], w:[34,74]},
  rowBas:      {h:[26,38], s:[34,42], p:[58,54], k:[56,74], a:[54,96], e:[26,52], w:[34,58]},
  fenteHaut:   {h:[46,16], s:[46,28], p:[46,54], k:[46,76], a:[46,96], e:[46,42], w:[46,58]},
  fenteBas:    {h:[42,24], s:[42,36], p:[44,60], k:[64,76], a:[68,96], e:[42,50], w:[42,66]},
  planche:     {h:[18,60], s:[30,64], p:[58,70], k:[76,80], a:[90,88], e:[26,76], w:[26,88]},
  planche2:    {h:[18,58], s:[30,62], p:[58,66], k:[76,76], a:[90,86], e:[26,74], w:[26,88]},
  curlBas:     {h:[50,16], s:[50,28], p:[50,54], k:[50,76], a:[50,96], e:[52,42], w:[54,58]},
  curlHaut:    {h:[50,16], s:[50,28], p:[50,54], k:[50,76], a:[50,96], e:[52,42], w:[42,30]},
  triBas:      {h:[50,16], s:[50,28], p:[50,54], k:[50,76], a:[50,96], e:[52,42], w:[62,32]},
  triHaut:     {h:[50,16], s:[50,28], p:[50,54], k:[50,76], a:[50,96], e:[52,42], w:[56,58]},
  molletBas:   {h:[50,18], s:[50,30], p:[50,56], k:[50,78], a:[50,98], e:[50,44], w:[50,58]},
  molletHaut:  {h:[50,10], s:[50,22], p:[50,48], k:[50,70], a:[50,90], e:[50,36], w:[50,50]},
  presseLoin:  {h:[16,64], s:[28,66], p:[54,68], k:[74,52], a:[92,44], e:[26,76], w:[24,84]},
  presseNear:  {h:[16,64], s:[28,66], p:[54,68], k:[62,44], a:[74,58], e:[26,76], w:[24,84]},
  legrHaut:    {h:[50,28], s:[50,40], p:[52,64], k:[52,84], a:[52,102],e:[46,46], w:[46,26]},
  legrBas:     {h:[50,28], s:[50,40], p:[52,64], k:[68,72], a:[80,60], e:[46,46], w:[46,26]}
};

const ILLUS = {
  squat:    {a:'deboutBarre', b:'squatBas',   tool:'barre',   sol:1, lab:['Départ','Position basse']},
  gobelet:  {a:'debout',      b:'squatGob',   tool:'halt1',   sol:1, lab:['Départ','Position basse']},
  presse:   {a:'presseNear',  b:'presseLoin', tool:'machine', sol:0, lab:['Flexion','Extension']},
  hinge:    {a:'hingeHaut',   b:'hingeBas',   tool:'barreB',  sol:1, lab:['Départ debout','Charnière']},
  pont:     {a:'pontBas',     b:'pontHaut',   tool:'barreB',  sol:1, lab:['Bas','Verrouillage']},
  bench:    {a:'benchHaut',   b:'benchBas',   tool:'barreB',  sol:0, lab:['Bras tendus','Barre au sternum']},
  pompe:    {a:'pompeHaut',   b:'pompeBas',   tool:null,      sol:1, lab:['Haut','Bas']},
  dip:      {a:'dipHaut',     b:'dipBas',     tool:null,      sol:0, lab:['Haut','Bas']},
  ohp:      {a:'ohpBas',      b:'ohpHaut',    tool:'barreB',  sol:1, lab:['Épaules','Bras tendus']},
  laterale: {a:'latBas',      b:'latHaut',    tool:'halt1',   sol:1, lab:['Bras le long','90 degrés']},
  traction: {a:'tracBas',     b:'tracHaut',   tool:'barreH',  sol:0, lab:['Suspension','Menton au niveau']},
  row:      {a:'rowHaut',     b:'rowBas',     tool:'barreB',  sol:1, lab:['Bras tendus','Barre au ventre']},
  fente:    {a:'fenteHaut',   b:'fenteBas',   tool:'halt1',   sol:1, lab:['Debout','Genou proche du sol']},
  gainage:  {a:'planche',     b:'planche2',   tool:null,      sol:1, lab:['Bassin bas','Bassin aligné']},
  curl:     {a:'curlBas',     b:'curlHaut',   tool:'halt1',   sol:1, lab:['Bras tendus','Contraction']},
  triceps:  {a:'triBas',      b:'triHaut',    tool:'halt1',   sol:1, lab:['Coudes fléchis','Extension']},
  mollet:   {a:'molletBas',   b:'molletHaut', tool:null,      sol:1, lab:['Talon bas','Pointes']},
  legraise: {a:'legrHaut',    b:'legrBas',    tool:'barreH',  sol:0, lab:['Suspension','Jambes à 90']}
};

function poseSVG(key, accent){
  const p = P[key]; if(!p) return '';
  const L=(a,b,w)=>`<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" stroke-width="${w||4}"/>`;
  return `<g fill="none" stroke="${accent}" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="${p.h[0]}" cy="${p.h[1]}" r="6.5" stroke-width="3.4"/>
    ${L(p.h,p.s,3.6)}${L(p.s,p.p,4.6)}${L(p.p,p.k,4.6)}${L(p.k,p.a,4.2)}
    ${L(p.s,p.e,3.6)}${L(p.e,p.w,3.4)}
  </g>`;
}
function toolSVG(kind, pose, col){
  const p = P[pose]; if(!p||!kind) return '';
  const w = p.w, s = p.s;
  if(kind==='barre')  return `<g stroke="${col}" stroke-width="3.2" stroke-linecap="round"><path d="M${s[0]-20} ${s[1]-1} L${s[0]+20} ${s[1]-1}"/><circle cx="${s[0]-20}" cy="${s[1]-1}" r="4.5" fill="${col}"/><circle cx="${s[0]+20}" cy="${s[1]-1}" r="4.5" fill="${col}"/></g>`;
  if(kind==='barreB') return `<g stroke="${col}" stroke-width="3.2" stroke-linecap="round"><path d="M${w[0]-18} ${w[1]} L${w[0]+18} ${w[1]}"/><circle cx="${w[0]-18}" cy="${w[1]}" r="4.5" fill="${col}"/><circle cx="${w[0]+18}" cy="${w[1]}" r="4.5" fill="${col}"/></g>`;
  if(kind==='barreH') return `<path d="M14 ${w[1]} L86 ${w[1]}" stroke="${col}" stroke-width="3.4" stroke-linecap="round"/>`;
  if(kind==='halt1')  return `<rect x="${w[0]-9}" y="${w[1]-3.5}" width="18" height="7" rx="3" fill="${col}"/>`;
  if(kind==='machine')return `<g stroke="${col}" stroke-width="3.2"><path d="M${p.a[0]+4} ${p.a[1]-14} L${p.a[0]+4} ${p.a[1]+12}"/></g>`;
  return '';
}

function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function dFR(s){ const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function jours(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ---------------- Calculs physiologiques --------------------------- */
// 1RM estimé, formule d'Epley bornée à 12 répétitions
function e1RM(kg, reps){
  if(!kg||!reps) return 0;
  const r = Math.min(reps,12);
  return Math.round(kg*(1+r/30)*10)/10;
}
const PCT = {1:1,2:.955,3:.92,4:.89,5:.865,6:.837,7:.81,8:.785,9:.76,10:.74,11:.715,12:.695,
             13:.675,14:.655,15:.64,16:.625,17:.61,18:.6,19:.585,20:.575};
function pct(r){ return PCT[Math.min(Math.max(Math.round(r),1),20)] || .55; }

// Dépense énergétique, Mifflin-St Jeor + facteur d'activité
function tdee(u){
  const s = u.sexe==='F' ? -161 : 5;
  const bmr = 10*u.poids + 6.25*u.taille - 5*u.age + s;
  const f = {2:1.375, 3:1.475, 4:1.55}[u.freq] || 1.45;
  return Math.round(bmr*f);
}
function nutri(u){
  const t = tdee(u);
  const surplus = u.niveau==='debutant' ? .15 : u.niveau==='intermediaire' ? .12 : .08;
  const kcal = Math.round(t*(1+surplus)/10)*10;
  const prot = Math.round(u.poids * (u.niveau==='debutant'?1.8:2.0));
  const lip  = Math.round(u.poids * 0.9);
  const gluc = Math.max(120, Math.round((kcal - prot*4 - lip*9)/4));
  const eau  = Math.round(u.poids*0.035*10)/10;
  return {tdee:t, kcal, prot, lip, gluc, eau, surplus:Math.round(t*surplus)};
}
// Cible de gain réaliste, modèle de McDonald / Aragon ajusté au sexe
function cibleGain(u){
  const base = u.niveau==='debutant' ? 10 : u.niveau==='intermediaire' ? 5 : 2.5;
  const f = u.sexe==='F' ? .5 : 1;
  const ageF = u.age>45 ? .75 : u.age>35 ? .9 : 1;
  const lo = Math.round(base*f*ageF*.6*10)/10, hi = Math.round(base*f*ageF*10)/10;
  return {lo, hi, rythme: Math.round(u.poids*0.0035*10)/10};
}

/* ---------------- Périodisation ------------------------------------ */
function semaineCourante(u){
  return Math.min(52, Math.floor(jours(u.dateDebut, today())/7) + 1);
}
function bloc(w){
  if(w<=1) return {id:'eval', n:'Prise de repères', d:'Semaine de mesure, charges modérées et technique sous contrôle', s:3, rep:[6,8], rir:3, tempo:'contrôlé'};
  if(w<=5) return {id:'adapt', n:'Adaptation anatomique', d:'Construire la technique et le tissu conjonctif', s:3, rep:[10,12], rir:3, tempo:'3 s de descente'};
  const p = (w-6) % 20;
  if(p<=3)  return {id:'hyperA', n:'Hypertrophie, accumulation', d:'Volume modéré, charge qui monte chaque semaine', s:4, rep:[8,12], rir:2, tempo:'2 s de descente'};
  if(p<=7)  return {id:'force',  n:'Intensification', d:'Charges lourdes sur les mouvements principaux', s:4, rep:[5,6], rir:2, tempo:'explosif à la montée'};
  if(p===8) return {id:'deload', n:'Décharge', d:'Volume divisé par deux, charges à 60 pour cent', s:2, rep:[8,10], rir:5, tempo:'léger'};
  if(p<=13) return {id:'hyperB', n:'Hypertrophie, volume maximal', d:'Le bloc qui construit le plus de masse', s:4, rep:[8,12], rir:1, tempo:'2 s de descente'};
  if(p<=17) return {id:'force2', n:'Force lourde', d:'Consolider les gains en charge maximale', s:5, rep:[4,6], rir:2, tempo:'explosif à la montée'};
  if(p===18)return {id:'deload', n:'Décharge', d:'Volume divisé par deux, charges à 60 pour cent', s:2, rep:[8,10], rir:5, tempo:'léger'};
  return {id:'retest', n:'Semaine de test', d:'Nouvelle mesure des charges maximales', s:3, rep:[5,5], rir:0, tempo:'maximal'};
}

const SPLITS = {
 2:[{id:'A', n:'Full body A', slots:[['squat','principal'],['pushH','principal'],['pullH','principal'],['pushV','secondaire'],['core','isolation'],['iso','isolation']]},

 3:[{id:'A', n:'Full body A, dominante jambes', slots:[['squat','principal'],['pushH','principal'],['pullH','secondaire'],['pushV','isolation'],['core','isolation'],['iso','isolation']]},

};
const ISO_ROT = ['latele','curlhalt','tricepoulie','mollets','facepull','oiseau','curlmart','dipsbanc','shrug','skull','curlbarre','ecarte'];

function dispo(u, e){
  if(u.lieu==='salle') return e.lieu.includes('s');
  if(u.lieu==='maison'){
    if(!e.lieu.includes('m')) return false;
    const m = u.materiel||[];
    const t = (e.mat||'').toLowerCase();
    if(/barre de traction/.test(t) && !m.includes('traction')) return false;
    if(/haltère|kettlebell/.test(t) && !m.includes('halteres') && !m.includes('sac')) return false;
    if(/élastique/.test(t) && !m.includes('elastique')) return false;
    if(/banc/.test(t) && !m.includes('banc')) return false;
    return true;
  }
  return true; // mixte
}
function niveauMax(u){ return u.niveau==='debutant' ? 3 : 5; }

function choisirExo(u, pat, role, exclus){
  const nMax = niveauMax(u);
  let pool = EXOS.filter(e=>e.pat===pat && dispo(u,e) && !exclus.includes(e.id) && !(role==='principal'&&e.noPrinc));
  if(!pool.length) pool = EXOS.filter(e=>e.pat===pat && !exclus.includes(e.id));
  if(!pool.length) return null;
  // principal : le plus complexe accessible. isolation : le plus simple.
  const ok = pool.filter(e=>e.c<=nMax);
  const src = ok.length?ok:pool;
  src.sort((a,b)=> role==='isolation' ? a.c-b.c : b.c-a.c);
  // un mouvement principal doit pouvoir se charger. Si le meilleur candidat est au
  // poids du corps, on cherche une variante chargeable un cran au-dessus.
  if(role==='principal' && RATIO[src[0].id]===0){
    const charg = pool.filter(e=>e.c<=nMax+1 && RATIO[e.id]!==0).sort((a,b)=>b.c-a.c);
    if(charg.length) return charg[0];
  }
  return src[0];
}
function seanceModele(u, idx){
  const sp = SPLITS[u.freq] || SPLITS[3];
  return sp[idx % sp.length];
}
function nbExos(u){ return u.duree<=45 ? 4 : u.duree<=60 ? 5 : 6; }

function construireSeance(u, idx, w){
  const mod = seanceModele(u, idx);
  const b = bloc(w);
  const key = 'sel_'+mod.id;
  if(!u.selection[key]){
    const ex = [], out = [];
    let isoI = idx;
    mod.slots.forEach(([pat, role])=>{
      let e;
      if(pat==='iso'){
        for(let k=0;k<ISO_ROT.length;k++){
          const cand = EXOS.find(x=>x.id===ISO_ROT[(isoI+k)%ISO_ROT.length]);
          if(cand && dispo(u,cand) && !out.includes(cand.id)){ e=cand; isoI+=k+1; break; }
        }
        if(!e) e = choisirExo(u,'iso',role,out);
      } else e = choisirExo(u, pat, role, out);
      if(e){ out.push(e.id); ex.push({id:e.id, role}); }
    });
    u.selection[key] = ex; save();
  }
  const liste = u.selection[key].slice(0, nbExos(u));
  return {
    id: mod.id, nom: mod.n, bloc: b, semaine: w,
    exos: liste.map(s=>{
      const e = EXOS.find(x=>x.id===s.id) || EXOS[0];
      return {...s, e, presc: prescription(u, e, s.role, b)};
    })
  };
}
function prescription(u, e, role, b){
  let s = b.s, rep = b.rep.slice(), rir = b.rir;
  if(role==='secondaire'){ s = Math.max(2, b.s-1); rep = b.id==='force'||b.id==='force2' ? [8,10] : b.rep; }
  if(role==='isolation'){ s = Math.max(2, b.s-1); rep = b.id==='force'||b.id==='force2' ? [10,12] : [12,15]; rir = Math.max(0,b.rir-1); }
  if(b.id==='deload'){ s=2; rep=[8,10]; rir=5; }
  if(RATIO[e.id]===0 && rep[1]<8){ rep=[8,12]; }   // poids du corps, pas de series ultra courtes sans lest
  const cible = Math.round((rep[0]+rep[1])/2);
  return {series:s, rep, rir, kg: chargeSuggeree(u, e, cible, rir, b), repos: u.repos[role]||120, role};
}

/* --------- estimation de charge de travail -------------------------- */
const REF = {squat:'tsquat', hinge:'tsquat', pushH:'tbench', pushV:'tohp', pullH:'trow', pullV:'trow', fente:'tsquat', iso:'tbench', core:null};
const RATIO = {
  backsquat:1, frontsquat:.85, bulgare:.30, hacksquat:1.05, presse:1.9, gobelet:.35, squatpc:0, legext:.42,
  sdt:1.25, sdtroum:1.0, sdtroumh:.42, hipthrust:1.15, pont:0, legcurl:.35, goodm:.5, swing:.28,
  devcouche:1, devhalt:.42, devincline:.86, dips:0, pompes:0, pompesdecl:0, ecarte:.30, pecdeck:.62,
  militaire:1, devepaule:.42, arnold:.36, latele:.14, pompepique:0, hspu:0,
  traction:0, tracsup:0, tirvert:.95, tracelast:0,
  rowbarre:1, rowhalt:.42, tirhoriz:1.05, rowinv:0, rowelast:0, facepull:.32,
  fentemarch:.30, fentearr:.30, stepup:.28,
  planche:0, roue:0, legraise:0, pallof:0, crunchinv:0, farmer:.5,
  curlbarre:.30, curlhalt:.14, curlmart:.14, tricepoulie:.35, skull:.28, dipsbanc:0, mollets:.6, oiseau:.10, shrug:.55
};
function meilleur1RM(u, exoId){
  let best = 0;
  (u.historique||[]).forEach(h=>{
    (h.exos||[]).forEach(x=>{
      if(x.id!==exoId) return;
      (x.series||[]).forEach(s=>{ if(s.ok && s.kg>0 && s.reps>0) best = Math.max(best, e1RM(s.kg, s.reps)); });
    });
  });
  return best;
}
function chargeSuggeree(u, e, reps, rir, b){
  if(RATIO[e.id]===0) return null;             // poids du corps
  let m = meilleur1RM(u, e.id);
  if(!m){
    const t = REF[e.pat];
    const base = t && u.eval.force[t] ? u.eval.force[t].e1rm : 0;
    if(!base) return null;
    const ref = {tsquat:'backsquat', tbench:'devcouche', tohp:'militaire', trow:'rowbarre'}[t];
    const rBase = RATIO[ref] || 1;
    m = base * ((RATIO[e.id]||.4)/rBase);
  }
  let kg = m * pct(reps + rir);
  if(b && b.id==='deload') kg *= .78;
  const f = u.formeDuJour ? u.formeDuJour.facteur : 1;
  kg *= f;
  const pas = kg>60 ? 2.5 : kg>20 ? 1.25 : 0.5;
  return Math.max(pas, Math.round(kg/pas)*pas);
}

/* ---------------- Statistiques et gamification ---------------------- */
function statsProfil(u){
  const h = u.historique||[];
  const volTotal = h.reduce((a,s)=>a+(s.volume||0),0);
  const maxVol = h.reduce((a,s)=>Math.max(a,s.volume||0),0);
  const dp = (u.poidsLog&&u.poidsLog.length) ? u.poidsLog[u.poidsLog.length-1].kg - u.poidsInit : 0;
  return {seances:h.length, volTotal, maxVol, streak:streak(u), prs:u.prs||0,
          quizGood:u.quiz.good, deltaPoids:Math.round(dp*10)/10};
}
function streak(u){
  // nombre de semaines consécutives, en remontant, avec au moins freq-1 séances
  const h = u.historique||[]; if(!h.length) return 0;
  const map = {};
  h.forEach(s=>{ const w = Math.floor(jours(u.dateDebut, s.date)/7); map[w]=(map[w]||0)+1; });
  const cur = Math.floor(jours(u.dateDebut, today())/7);
  let n=0;
  for(let w=cur; w>=0; w--){
    if((map[w]||0) >= Math.max(1,u.freq-1)) n++;
    else if(w!==cur) break;
  }
  return n;
}
function niveauXP(u){
  const xp = u.xp||0, seuil = 500;
  const lvl = Math.floor(xp/seuil)+1;
  return {lvl, dans:xp%seuil, seuil, pct:Math.round((xp%seuil)/seuil*100)};
}
function addXP(u, n, why){
  u.xp = (u.xp||0)+n;
  const av = (u.badges||[]).slice();
  const st = statsProfil(u);
  BADGES.forEach(b=>{ if(!u.badges.includes(b.id) && b.t(st)) u.badges.push(b.id); });
  const nouveaux = u.badges.filter(b=>!av.includes(b));
  save();
  if(nouveaux.length){ const b = BADGES.find(x=>x.id===nouveaux[0]); toast('Badge débloqué, '+b.n); }
  else if(why) toast('+'+n+' XP, '+why);
}

/* ---------------- Repas du jour ------------------------------------- */
function repasDuJour(u, estEntrainement){
  const n = nutri(u);
  const seed = parseInt(today().replace(/-/g,''),10) + (u.id.length);
  const pick = (type)=>{
    const pool = REPAS.filter(r=>r.t===type && (r.j==='both' || r.j===(estEntrainement?'entrainement':'repos')));
    return pool[seed % pool.length];
  };
  const cols = n.kcal>3000 ? 2 : 1;
  const plan = [pick('pdj'), pick('dej'), pick('din')];
  const colls = REPAS.filter(r=>r.t==='col' && (r.j==='both'||r.j===(estEntrainement?'entrainement':'repos')));
  for(let i=0;i<cols;i++) plan.push(colls[(seed+i*3) % colls.length]);
  const somme = plan.reduce((a,r)=>({k:a.k+r.k, p:a.p+r.p}), {k:0,p:0});
  const ecart = Math.round(n.kcal - somme.k);
  return {plan, somme, ecart, n, estEntrainement};
}

function formeValider(){

  U.formeDuJour = {date:today(), score, facteur, passe:false, detail:vals};
  U.formeLog = (U.formeLog||[]).filter(x=>x.date!==today()).concat([{date:today(), score}]);
  save(); closeSheet(); render();
  toast(facteur<1 ? 'Charges réduites de '+Math.round((1-facteur)*100)+' pour cent aujourd\'hui' : facteur>1 ? 'Bonne forme, charges légèrement majorées' : 'Charges standard maintenues');

  const blocs = [];
  for(let i=1;i<=52;i++){ const bb = bloc(i); if(!blocs.length || blocs[blocs.length-1].n!==bb.n) blocs.push({n:bb.n, de:i, a:i, id:bb.id}); else blocs[blocs.length-1].a=i; }
  c += blocs.map(x=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line);${x.de<=w&&w<=x.a?'color:var(--accent)':''}">
      <span class="small">${x.n}</span><span class="small num">S${x.de}${x.a>x.de?' à S'+x.a:''}</span></div>`).join('');
  c += `</div>
  <div class="card">
    <h3 class="mb">Temps de repos</h3>
    ${[['principal','Mouvements principaux'],['secondaire','Mouvements secondaires'],['isolation','Isolation et gainage']].map(([k,l])=>
      `<label class="f"><span>${l}</span><input type="number" step="15" value="${U.repos[k]}" oninput="U.repos.${k}=+this.value||60;save()"></label>`).join('')}
    <p class="hint">Repos courts sur les principaux égale volume de charge plus faible, donc moins d'hypertrophie. Ne descends pas sous 2 minutes sur les mouvements lourds.</p>
  </div>`;
  return c;
}

  if(m.mepaule===0)  u.restrictions.push('Épaule limitée en flexion, remplace le développé militaire barre par des haltères en prise neutre');
  if(m.mhanche===0)  u.restrictions.push('Charnière de hanche non maîtrisée, reste sur le soulevé roumain haltères avant la barre');
  if(m.msquat===0)   u.restrictions.push('Squat profond non disponible, travaille en amplitude partielle contrôlée et ajoute de la mobilité');

function chargeTxt(x){

  }

  return 'charge à déterminer, monte progressivement';
}
function volumeBrouillon(b){
  return Math.round(b.exos.reduce((a,e)=>a + e.series.reduce((x,s)=> x + (s.ok ? (parseFloat(s.kg)||0)*(parseInt(s.reps)||0) : 0), 0), 0));

function setVal(i,j,k,v){ U.brouillon.exos[i].series[j][k] = v; save(); }
function valider(i,j){
  const s = U.brouillon.exos[i].series[j];
  s.ok = !s.ok;
  if(s.ok){
    if(!s.reps) s.reps = U.brouillon.exos[i].presc.rep[0];
    if(!s.kg && U.brouillon.exos[i].presc.kg) s.kg = U.brouillon.exos[i].presc.kg;
    startTimer(U.brouillon.exos[i].presc.repos);
    // pré-remplit la série suivante
    const nx = U.brouillon.exos[i].series[j+1];
    if(nx && !nx.kg) nx.kg = s.kg;
  }
  save(); render();
}

function finirSeance(){
  const b = U.brouillon;
  const exos = b.exos.map(e=>({id:e.id, n:e.n, series:e.series.filter(s=>s.ok).map(s=>({kg:parseFloat(s.kg)||0, reps:parseInt(s.reps)||0, ok:true}))}))
                     .filter(e=>e.series.length);
  if(!exos.length) return toast('Valide au moins une série avant de terminer');
  // records
  let prs = 0;
  exos.forEach(e=>{
    const av = meilleur1RM(U, e.id);
    const ap = e.series.reduce((a,s)=>Math.max(a, e1RM(s.kg,s.reps)),0);
    if(ap>av && av>0) prs++;
  });
  const s = {date:today(), semaine:b.semaine, seanceId:b.seanceId, nom:b.nom, bloc:b.bloc,
             exos, volume:volumeBrouillon(b), duree:Math.round((Date.now()-b.debut)/60000),
             forme:(U.formeDuJour&&U.formeDuJour.date===today())?U.formeDuJour.score:null};
  U.historique = (U.historique||[]).concat([s]);
  U.prs = (U.prs||0) + prs;
  U.brouillon = null;
  stopTimer(); save();
  addXP(U, 100 + prs*40 + Math.min(60, Math.round(s.volume/200)), 'séance terminée');
  VIEW='stats'; render();
  toast(prs? prs+' record'+(prs>1?'s':'')+' personnel'+(prs>1?'s':'')+' battu'+(prs>1?'s':'') : 'Séance enregistrée, '+s.volume+' kg soulevés');
}

/* =====================================================================
   Chronomètre de repos
   ===================================================================== */
function bar(){
  let b = document.getElementById('tbar');
  if(!b){ b = document.createElement('div'); b.id='tbar'; document.body.appendChild(b); }
  return b;
}
function startTimer(sec){
  stopTimer();
  TIMER = {fin: Date.now()+sec*1000, dur: sec};
  TIMER.int = setInterval(tickTimer, 250);
  renderTimer();
}
function stopTimer(){ if(TIMER&&TIMER.int) clearInterval(TIMER.int); TIMER=null; renderTimer(); }
function addTimer(s){ if(TIMER){ TIMER.fin += s*1000; renderTimer(); } }
function tickTimer(){
  if(!TIMER) return;
  if(TIMER.fin - Date.now() <= 0){ bip(); stopTimer(); toast('Repos terminé, série suivante'); return; }
  renderTimer();
}
function renderTimer(){
  const b = bar();
  if(!TIMER || VIEW!=='seance'){ b.innerHTML=''; return; }
  const r = Math.max(0, Math.ceil((TIMER.fin-Date.now())/1000));
  const m = Math.floor(r/60), s = String(r%60).padStart(2,'0');
  b.innerHTML = `<div class="timerbar"><div class="in">
    <div class="t">${m}:${s}</div>
    <div style="flex:1" class="small"><b>Repos</b><div style="opacity:.75">série suivante dans ${r} s</div></div>
    <button onclick="addTimer(30)">+30 s</button>
    <button onclick="stopTimer()">Passer</button>
  </div></div>`;
}
function bip(){
  try{
    const c = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22,0.44].forEach(t=>{
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination); o.frequency.value = 880; o.type='sine';
      g.gain.setValueAtTime(0.0001, c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.35, c.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t+0.18);
      o.start(c.currentTime+t); o.stop(c.currentTime+t+0.2);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
}

/* =====================================================================
   Progrès
   ===================================================================== */
function ligne(pts, unite){
  if(pts.length<2) return `<div class="empty small">Deux mesures minimum pour tracer une courbe</div>`;
  const W=320,H=120,P=22;
  const xs = pts.map((p,i)=>i), ys = pts.map(p=>p.v);
  const mn = Math.min(...ys), mx = Math.max(...ys), sp = (mx-mn)||1;
  const X = i=>P + i*(W-2*P)/(xs.length-1);
  const Y = v=>H-P - ((v-mn)/sp)*(H-2*P);
  const d = pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const aire = d + ` L${X(pts.length-1).toFixed(1)} ${H-P} L${X(0).toFixed(1)} ${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <path d="${aire}" fill="rgba(255,107,53,.14)"/>
    <path d="${d}" fill="none" stroke="#FF6B35" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="#FF6B35"/>`).join('')}
    <text x="${P}" y="12" fill="#8FAAB4" font-size="9" font-family="system-ui">${mx}${unite}</text>
    <text x="${P}" y="${H-6}" fill="#8FAAB4" font-size="9" font-family="system-ui">${mn}${unite}</text>
  </svg>`;
}
function barres(vals, labs){
  if(!vals.length) return '';
  const W=320,H=110,P=18, mx = Math.max(...vals,1), n = vals.length;
  const bw = (W-2*P)/n - 5;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${vals.map((v,i)=>{
      const h = Math.max(2,(v/mx)*(H-2*P-10)), x = P+i*((W-2*P)/n), y = H-P-h;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${i===n-1?'#FF6B35':'#2C5566'}"/>
              <text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="#5F7F8B" font-size="8" font-family="system-ui">${labs[i]}</text>`;
    }).join('')}
  </svg>`;
}
function viewStats(){
  const st = statsProfil(U), h = (U.historique||[]).slice().reverse();
  const lv = niveauXP(U);
  let c = `<h1 class="mb">Progrès</h1>

    <div class="stat"><div class="v num">${st.seances}</div><div class="k">séances terminées</div></div>
    <div class="stat"><div class="v num">${st.volTotal<5000? st.volTotal+' kg' : (Math.round(st.volTotal/100)/10)+' t'}</div><div class="k">volume cumulé</div></div>
    <div class="stat"><div class="v num">${st.streak}</div><div class="k">semaines d'affilée</div></div>
    <div class="stat"><div class="v num">${st.prs}</div><div class="k">records battus</div></div>
  </div>`;

  const pl = (U.poidsLog||[]).slice(-20);
  c += `<div class="card">
    <div class="row between mb"><h3>Poids de corps</h3><span class="badge ${st.deltaPoids>=0?'ok':''}">${st.deltaPoids>0?'+':''}${st.deltaPoids} kg</span></div>
    ${ligne(pl.map(p=>({v:p.kg})),' kg')}
    <div class="row between small muted mt"><span>${pl.length?dFR(pl[0].d):''}</span><span>${pl.length?dFR(pl[pl.length-1].d):''}</span></div>
    <button class="btn ghost sm mt" onclick="poidsSheet()">Ajouter une pesée</button>
  </div>`;

  // volume par semaine
  const map = {};
  (U.historique||[]).forEach(s=>{ const w = Math.floor(jours(U.dateDebut,s.date)/7)+1; map[w]=(map[w]||0)+s.volume; });
  const ws = Object.keys(map).map(Number).sort((a,b)=>a-b).slice(-8);
  c += `<div class="card">
    <h3 class="mb">Volume par semaine, en kg soulevés</h3>
    ${ws.length? barres(ws.map(w=>map[w]), ws.map(w=>'S'+w)) : '<div class="empty small">Termine une séance pour voir apparaître ton volume</div>'}
    <p class="hint">Le volume doit monter progressivement à l'intérieur d'un bloc, puis chuter en semaine de décharge. Une baisse non planifiée signale une fatigue ou un manque de calories.</p>
  </div>`;

  // records estimés
  const ids = [...new Set((U.historique||[]).flatMap(s=>s.exos.map(e=>e.id)))];
  const recs = ids.map(id=>({id, n:(EXOS.find(e=>e.id===id)||{}).n||id, m:meilleur1RM(U,id)}))
                  .filter(r=>r.m>0).sort((a,b)=>b.m-a.m).slice(0,8);
  c += `<div class="card">
    <h3 class="mb">Maximum estimé par exercice</h3>
    ${recs.length? `<table class="h">${recs.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.m} kg</td></tr>`).join('')}</table>
      <p class="hint mt">Estimation par la formule d'Epley à partir de ta meilleure série. Fiable jusqu'à 10 répétitions, approximative au-delà.</p>`
      : '<div class="empty small">Aucune donnée pour l\'instant</div>'}
  </div>`;

  c += `<div class="card">
    <div class="row between mb"><h3>Historique</h3><span class="small muted">${h.length} séances</span></div>
    ${h.length? h.slice(0,25).map((s,i)=>`<button class="q" onclick="seanceSheet(${(U.historique||[]).length-1-i})">
        <div class="row between"><b>${esc(s.nom)}</b><span class="small num">${s.volume} kg</span></div>
        <div class="xs dim mt">${dFR(s.date)}, semaine ${s.semaine}, ${s.duree} min, ${s.exos.length} exercices${s.forme?', forme '+s.forme:''}</div>
      </button>`).join('')
      : `<div class="empty"><b>Pas encore d'historique</b>Chaque séance validée vient s'empiler ici, avec le détail série par série.</div>`}
  </div>`;
  return c;
}
function seanceSheet(i){
  const s = U.historique[i]; if(!s) return;
  sheet(`<h2>${esc(s.nom)}</h2>
    <p class="small muted mb">${dFR(s.date)}, semaine ${s.semaine}, ${s.duree} minutes, ${s.volume} kg de volume total.</p>
    ${s.exos.map(e=>`<div class="card flat"><b>${esc(e.n)}</b>
      <table class="h mt">${e.series.map((x,j)=>`<tr><td>Série ${j+1}</td><td>${x.kg} kg x ${x.reps}</td></tr>`).join('')}</table></div>`).join('')}
    <button class="btn ghost mt" onclick="closeSheet()">Fermer</button>`);
}

/* =====================================================================
   Savoir, quiz et badges
   ===================================================================== */
let QZ = null;
function viewJeu(){
  const lv = niveauXP(U), st = statsProfil(U);
  const cats = [...new Set(QUIZ.map(q=>q.c))];
  let c = `<h1 class="mb">Savoir</h1>
  <div class="card hero">
    <div class="row between"><div><div class="eyebrow">Niveau ${lv.lvl}</div><h2>${U.xp||0} XP</h2></div>
      <div style="text-align:right"><div class="num" style="font-size:22px;font-weight:800">${U.quiz.good}</div><div class="xs dim">bonnes réponses</div></div></div>
    <div class="lvl mt"><i style="width:${lv.pct}%"></i></div>
    <p class="small muted mt">Séance terminée, 100 XP. Record battu, 40 XP. Bonne réponse, 15 XP. Pesée, 10 XP.</p>
  </div>
  <div class="card">
    <h3 class="mb">Question du jour</h3>
    <p class="small muted mb">Choisis un thème. Les questions sur ${esc(U.sport)} sont incluses si tu en as choisi un.</p>
    <div class="scroller mb">
      <button class="chip on" onclick="quizStart('tous')">Tout mélanger</button>
      ${cats.map(k=>`<button class="chip" onclick="quizStart('${k}')">${k}</button>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="row between mb"><h3>Badges</h3><span class="small muted">${(U.badges||[]).length} sur ${BADGES.length}</span></div>
    ${BADGES.map(b=>{
      const ok = (U.badges||[]).includes(b.id);
      return `<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line);${ok?'':'opacity:.42'}">
        <div><b class="small">${b.n}</b><div class="xs dim">${b.d}</div></div>
        <span class="badge ${ok?'gold':''}">${ok?'obtenu':'à faire'}</span></div>`;
    }).join('')}
  </div>`;
  return c;
}
function quizStart(cat){
  let pool = QUIZ.filter(q=>cat==='tous'? true : q.c===cat);
  if(cat==='tous' && U.sport && U.sport!=='Aucun en particulier'){
    pool = pool.concat(QUIZ.filter(q=>q.c===U.sport));
  }
  pool = pool.filter(q=>!(U.quiz.vues||[]).includes(q.q));
  if(!pool.length){ (U.quiz.vues=[]); pool = QUIZ.filter(q=>cat==='tous'||q.c===cat); }
  const q = pool[Math.floor(Math.random()*pool.length)];
  QZ = {q, rep:null};
  quizSheet();
}
function quizSheet(){
  const q = QZ.q;
  sheet(`<div class="row between mb"><span class="badge acc">${q.c}</span><span class="small muted num">${U.quiz.good} bonnes</span></div>
    <h2 class="mb">${esc(q.q)}</h2>
    ${q.o.map((o,i)=>{
      let cl='';
      if(QZ.rep!==null){ if(i===q.r) cl='good'; else if(i===QZ.rep) cl='bad'; }
      return `<div class="q ${cl}" onclick="${QZ.rep===null?`quizRep(${i})`:''}">${esc(o)}</div>`;
    }).join('')}
    ${QZ.rep!==null?`<div class="card flat mt"><div class="eyebrow" style="color:${QZ.rep===q.r?'var(--ok)':'var(--warn)'}">${QZ.rep===q.r?'Bonne réponse':'Mauvaise réponse'}</div>
      <p class="small muted" style="margin:0">${esc(q.e)}</p></div>
      <button class="btn mt" onclick="quizStart('tous')">Question suivante</button>
      <button class="btn ghost mt" onclick="closeSheet();render()">Terminer</button>`
    :`<button class="btn ghost mt" onclick="closeSheet()">Plus tard</button>`}`);
}
function quizRep(i){
  QZ.rep = i;
  const bon = i===QZ.q.r;
  U.quiz.vues = (U.quiz.vues||[]).concat([QZ.q.q]).slice(-80);
  if(bon){ U.quiz.good++; addXP(U, 15, 'bonne réponse'); } else { U.quiz.bad++; save(); }
  quizSheet();
}

/* =====================================================================
   Profils, sauvegarde, partage
   ===================================================================== */
function profilSheet(){
  const n = U?nutri(U):null;
  sheet(`<h2 class="mb">Profils</h2>
    ${DB.profils.map(p=>`<button class="q ${U&&p.id===U.id?'good':''}" onclick="switchProfil('${p.id}')">
      <div class="row between"><b>${esc(p.nom)}</b><span class="small muted num">${(p.historique||[]).length} séances</span></div>
      <div class="xs dim mt">${p.niveau}, ${p.freq} séances par semaine, ${p.lieu}</div></button>`).join('')}
    <button class="btn soft mt" onclick="closeSheet();U=null;TMP={};renderOnboarding(2)">Ajouter un profil</button>
    ${U?`<div class="sep"></div>
    <h3 class="mb">Réglages de ${esc(U.nom)}</h3>
    <div class="grid2">
      <label class="f"><span>Séances par semaine</span><select onchange="U.freq=+this.value;U.selection={};save();closeSheet();render()">
        ${[2,3,4].map(f=>`<option ${U.freq===f?'selected':''} value="${f}">${f}</option>`).join('')}</select></label>
      <label class="f"><span>Durée</span><select onchange="U.duree=+this.value;save();closeSheet();render()">
        ${[45,60,75].map(d=>`<option ${U.duree===d?'selected':''} value="${d}">${d} min</option>`).join('')}</select></label>
    </div>
    <label class="f"><span>Lieu</span><select onchange="U.lieu=this.value;U.selection={};save();closeSheet();render()">
      ${[['salle','Salle'],['mixte','Les deux'],['maison','Maison']].map(([v,l])=>`<option value="${v}" ${U.lieu===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f"><span>Sport favori</span><select onchange="U.sport=this.value;save()">
      ${SPORTS.map(s=>`<option ${U.sport===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="f"><span>Niveau</span><select onchange="U.niveau=this.value;U.selection={};save();closeSheet();render()">
      ${[['debutant','Débutant'],['intermediaire','Intermédiaire'],['avance','Avancé']].map(([v,l])=>`<option value="${v}" ${U.niveau===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <p class="hint">Dépense estimée ${n.tdee} kcal, objectif ${n.kcal} kcal et ${n.prot} g de protéines par jour.</p>
    <div class="sep"></div>`:''}
    <h3 class="mb">Installer sur le téléphone</h3>
    <p class="small muted mb">iPhone, ouvre le fichier dans Safari puis Partager, Sur l'écran d'accueil. Android, ouvre-le dans Chrome puis menu, Ajouter à l'écran d'accueil. L'application fonctionne ensuite sans connexion.</p>
    <h3 class="mb">Sauvegarde</h3>
    <p class="small muted mb">Tout est enregistré automatiquement sur cet appareil, à chaque saisie. Exporte un fichier pour changer de téléphone ou faire une copie.</p>
    <div class="btnrow mb"><button class="btn soft sm" onclick="exportJSON()">Exporter</button>
      <button class="btn soft sm" onclick="importJSON()">Importer</button></div>
    ${U?`<button class="btn danger mt" onclick="supprimerProfil()">Supprimer ce profil</button>`:''}
    <button class="btn ghost mt" onclick="closeSheet()">Fermer</button>`);
}
function switchProfil(id){
  DB.actif = id; U = DB.profils.find(p=>p.id===id); save(); closeSheet(); VIEW='jour'; render();
  toast('Profil actif, '+U.nom);
}
function supprimerProfil(){
  if(!confirm('Supprimer définitivement le profil '+U.nom+' et son historique ?')) return;
  DB.profils = DB.profils.filter(p=>p.id!==U.id);
  U = DB.profils[0]||null; DB.actif = U?U.id:null; save(); closeSheet();
  U?render():renderOnboarding(1);
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(DB,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'charge-sauvegarde-'+today()+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Fichier de sauvegarde généré');
}
function importJSON(){
  const i = document.createElement('input'); i.type='file'; i.accept='application/json';
  i.onchange = ()=>{
    const f = i.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d.profils) throw 0;
        const ids = DB.profils.map(p=>p.id);
        d.profils.forEach(p=>{ if(!ids.includes(p.id)) DB.profils.push(p); });
        DB.actif = d.actif || DB.profils[0].id;
        U = DB.profils.find(p=>p.id===DB.actif);
        save(); closeSheet(); render(); toast('Sauvegarde importée');
      }catch(e){ toast('Fichier illisible'); }
    };
    r.readAsText(f);
  };
  i.click();
}

/* ---------------- Démarrage ----------------------------------------- */
load();
if(U && U.brouillon && U.brouillon.date!==today()){ U.brouillon = null; save(); }
render();
setInterval(()=>{ if(VIEW==='seance') save(); }, 20000);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
window.addEventListener('pagehide', save);

</script>
</body>
